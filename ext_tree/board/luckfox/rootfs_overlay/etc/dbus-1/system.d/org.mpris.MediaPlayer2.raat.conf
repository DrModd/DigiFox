<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- DigiFox: Roon Ready (raat_app, транспорт hifiberry) — MPRIS для кнопок плеера с пульта усилителя -->
<busconfig>
  <policy user="root">
    <allow own="org.mpris.MediaPlayer2.raat"/>
    <allow send_destination="org.mpris.MediaPlayer2.raat"/>
    <allow receive_sender="org.mpris.MediaPlayer2.raat"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.mpris.MediaPlayer2.raat"/>
    <allow receive_sender="org.mpris.MediaPlayer2.raat"/>
  </policy>
</busconfig>
